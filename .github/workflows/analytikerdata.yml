name: Daglig analytikerdata

on:
  schedule:
    # Vardagar 00:00 UTC. GitHub kör schemalagda jobb för det här repot 4–6 h
    # försenat (divergens-cron 06:00 UTC startade 10:00–12:13 UTC) — så tidigt
    # att datan ändå finns i gisten innan sidan öppnas på morgonen.
    - cron: "0 0 * * 1-5"
  workflow_dispatch: {}      # kan även köras manuellt från GitHub

jobs:
  analytikerdata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Hämta analytikerdata från Yahoo (Render blockeras) och spara i gisten
        run: python3 etoro_analys.py --analytikerdata
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
